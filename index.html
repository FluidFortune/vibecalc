<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vibe Calc</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #0a0e27;
            font-family: 'Monaco', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            text-align: center;
        }
        .title {
            color: #00ff88;
            font-size: 36px;
            font-weight: bold;
            margin-bottom: 5px;
            text-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
        }
        .slogan {
            color: #00ff88;
            font-size: 14px;
            margin-bottom: 30px;
            opacity: 0.8;
        }
        .calc {
            background: #1a1f3a;
            border: 2px solid #00ff88;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.3);
            max-width: 300px;
            margin: 0 auto;
        }
        .display {
            background: #0a0e27;
            color: #00ff88;
            font-size: 32px;
            padding: 15px;
            border-radius: 4px;
            text-align: right;
            margin-bottom: 15px;
            min-height: 40px;
            word-wrap: break-word;
            word-break: break-all;
        }
        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }
        button {
            padding: 15px;
            font-size: 18px;
            background: #2a2f4a;
            color: #00ff88;
            border: 1px solid #00ff88;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'Monaco', monospace;
            font-weight: bold;
        }
        button:hover {
            background: #00ff88;
            color: #0a0e27;
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
        }
        button.operator {
            background: #3a3f5a;
        }
        button.equals {
            grid-column: span 2;
            background: #1a4d2e;
            border-color: #00ff88;
        }
        button.equals:hover {
            background: #2d8659;
        }
        .footer {
            color: #00ff88;
            font-size: 12px;
            margin-top: 30px;
            opacity: 0.7;
        }
        .footer a {
            color: #00ff88;
            text-decoration: none;
            font-weight: bold;
            transition: all 0.2s;
        }
        .footer a:hover {
            text-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="title">Vibe Calc</div>
        <div class="slogan">Calculating the Vibes</div>
        <div class="calc">
            <div class="display" id="display">0</div>
        <div class="buttons">
            <button onclick="clearDisplay()">C</button>
            <button onclick="appendOperator('/')">÷</button>
            <button onclick="appendOperator('*')">×</button>
            <button onclick="deleteLast()">⌫</button>
            
            <button onclick="appendNumber('7')">7</button>
            <button onclick="appendNumber('8')">8</button>
            <button onclick="appendNumber('9')">9</button>
            <button class="operator" onclick="appendOperator('-')">−</button>
            
            <button onclick="appendNumber('4')">4</button>
            <button onclick="appendNumber('5')">5</button>
            <button onclick="appendNumber('6')">6</button>
            <button class="operator" onclick="appendOperator('+')">+</button>
            
            <button onclick="appendNumber('1')">1</button>
            <button onclick="appendNumber('2')">2</button>
            <button onclick="appendNumber('3')">3</button>
            <button class="operator" onclick="appendOperator('%')">%</button>
            
            <button onclick="appendNumber('0')">0</button>
            <button onclick="appendNumber('.')">.</button>
            <button class="equals" onclick="calculate()">=</button>
        </div>
        </div>
        <div class="footer">For more good vibes, go to our main page at <a href="https://www.fluidfortune.com">Fluid Fortune</a></div>
    </div>

    <script>
        let display = document.getElementById('display');
        let currentInput = '0';
        let operator = null;
        let previousValue = null;

        function updateDisplay() {
            display.textContent = currentInput;
        }

        function appendNumber(num) {
            if (currentInput === '0' && num !== '.') {
                currentInput = num;
            } else if (num === '.' && currentInput.includes('.')) {
                return;
            } else {
                currentInput += num;
            }
            updateDisplay();
        }

        function appendOperator(op) {
            if (operator !== null && currentInput !== '') {
                calculate();
            }
            previousValue = parseFloat(currentInput);
            operator = op;
            currentInput = '0';
        }

        function calculate() {
            if (operator === null || previousValue === null) return;
            
            const current = parseFloat(currentInput);
            
            switch(operator) {
                case '+': break;
                case '-': break;
                case '*': break;
                case '/': break;
                case '%': break;
                default: return;
            }
            
            currentInput = 'the vibes are good';
            operator = null;
            previousValue = null;
            updateDisplay();
        }

        function clearDisplay() {
            currentInput = '0';
            operator = null;
            previousValue = null;
            updateDisplay();
        }

        function deleteLast() {
            currentInput = currentInput.slice(0, -1) || '0';
            updateDisplay();
        }
    </script>
</body>
</html>
